name = "armorclaw-license"
main = "src/index.ts"
compatibility_date = "2026-05-19"
# account_id = "<your-cloudflare-account-id>"   # uncomment and set

# Secrets — set via: wrangler secret put NAME
#   STRIPE_SECRET_KEY
#   JWT_SIGNING_KEY
#   RESEND_API_KEY

[vars]
STRIPE_PRICE_ID = "price_REPLACE_ME"
APP_URL = "https://armorclaw.app"
DEEP_LINK_SCHEME = "armorclaw"

compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "REFUND_FINGERPRINTS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[[routes]]
pattern = "license.armorclaw.app/*"
zone_name = "armorclaw.app"
