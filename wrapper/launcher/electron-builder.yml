# electron-builder configuration for ArmorClaw Launcher

appId: ai.armorclaw.launcher
productName: ArmorClaw
copyright: Copyright © 2026 ArmorClaw

directories:
  output: ../../dist/launcher

files:
  - "dist-src/**/*"
  - "assets/**/*"
  - "package.json"
  - "!node_modules/.cache"
  - "!**/*.ts"
  - "!tsconfig.json"

extraMetadata:
  main: "dist-src/launcher/main.js"

# ── Auto-update ────────────────────────────────────────────────────────────────

publish:
  provider: github
  owner: armorclaw
  repo: armorclaw

# ── macOS ─────────────────────────────────────────────────────────────────────

mac:
  category: public.app-category.productivity
  icon: assets/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
  darkModeSupport: false
  hardenedRuntime: true

dmg:
  title: "ArmorClaw"
  background: assets/dmg-background.png
  window:
    width: 540
    height: 380
  contents:
    - x: 130
      y: 200
    - x: 410
      y: 200
      type: link
      path: /Applications

# ── Windows ───────────────────────────────────────────────────────────────────

win:
  icon: assets/icon-256.png
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ArmorClaw
  runAfterFinish: true

# ── Linux ─────────────────────────────────────────────────────────────────────

linux:
  icon: assets/icon-256.png
  target:
    - target: AppImage
      arch:
        - x64
  category: Utility
